# Release the CLI as a prebuilt tarball on GitHub Releases (g7b #3633, design B5 / 7.5).
#
# Push a tag `v<semver>` (e.g. v0.4.0): the job builds, tests, packs and attaches
#   good7ob-cli.tgz         -> npm i -g https://github.com/good7ob/g7b-cli/releases/latest/download/good7ob-cli.tgz
#   good7ob-cli.tgz.sha256  -> checksum for the install scripts
# to the release of that tag (created if missing). Not published to npm.
# The package version inside the tarball is taken from the tag, so `good7ob --version` matches the release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (also builds dist/ via prepare)
        run: npm ci

      - name: Set the package version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "tag $GITHUB_REF_NAME is not v<semver>" >&2
            exit 1
          fi
          npm version "$version" --no-git-tag-version --allow-same-version

      - name: Type check
        run: npx tsc --noEmit -p .

      - name: Test
        run: npx vitest run

      - name: Pack
        run: |
          npm pack
          mv good7ob-cli-*.tgz good7ob-cli.tgz
          sha256sum good7ob-cli.tgz | awk '{print $1}' > good7ob-cli.tgz.sha256
          tar -tzf good7ob-cli.tgz | grep -q '^package/dist/index.js$'
          # a dev flavor file must never ship (it would point every install at a dev backend)
          ! tar -tzf good7ob-cli.tgz | grep -q 'dev-env.json'

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" good7ob-cli.tgz good7ob-cli.tgz.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" good7ob-cli.tgz good7ob-cli.tgz.sha256 \
              --title "good7ob CLI $GITHUB_REF_NAME" --generate-notes \
              $(case "$GITHUB_REF_NAME" in *-*) echo --prerelease;; esac)
          fi
